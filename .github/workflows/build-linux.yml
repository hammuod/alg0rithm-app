name: Build ALL Linux packages (free tier)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  packages:
    name: Build deb + rpm + arch + alpine + tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Build everything
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-all-linux.sh

      - name: List outputs
        run: ls -lh dist/

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alg0rithm-linux-all
          path: dist/

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Coverage summary
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - name: Distros covered
        run: |
          echo "✅ Debian / Ubuntu / Mint / Pop / Zorin / Elementary / MX / Deepin → .deb"
          echo "✅ Fedora / RHEL / Rocky / Alma / CentOS → .rpm"
          echo "✅ openSUSE / SLES → .rpm + zypper"
          echo "✅ Arch / Manjaro / Endeavour / Garuda → PKGBUILD src"
          echo "✅ Alpine → APKBUILD src"
          echo "✅ Any other (Void, Gentoo, ...) → universal tarball + install.sh"
          echo "✅ Flatpak path ready in packaging/flatpak/"
          echo "All built on free ubuntu-latest runners."
