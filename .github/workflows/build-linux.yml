name: Build Linux packages (free tier)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-latest   # free
    steps:
      - uses: actions/checkout@v4

      - name: Build DEB
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alg0rithm-deb
          path: dist/*.deb*

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appimage-prep:
    name: Prepare AppImage dir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AppDir
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alg0rithm-appimage-dir
          path: dist/*.tar.gz

  summary:
    name: Summary
    needs: [deb, appimage-prep]
    runs-on: ubuntu-latest
    steps:
      - name: Done
        run: |
          echo "Linux packages built successfully on free runners."
          echo "Next: Windows, then macOS, then Android."
